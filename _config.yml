# Jekyll configuration for Yolongtec V8 (Pure Chinese)
#
title: 园龙科技
description: 专业电动工具制造商
baseurl: /yolongtec-website-v8

# Build settings
markdown: kramdown
highlighter: rouge
timezone: Asia/Shanghai

# Collections
collections:
  articles:
    output: true
    permalink: /news/:name/

defaults:
  - scope:
      path: "_articles"
    values:
      layout: article

# Exclude from site build
exclude:
  - README.md
  - README_V7.md
  - DEPLOY.md
  - TODO.md
  - SPEC.md
  - CHANGELOG.md
  - content/

# Keep static files
keep_files:
  - images
  - news
  - about
  - contact
  - technology
  - legal
  - logo-green.png
  - logo-white.png
  - styles.css
  - script.js

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
