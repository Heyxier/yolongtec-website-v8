<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - 园龙科技</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .nav-link {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.95rem;
        }
        .btn { font-size: 0.95rem; }
        .btn-large { font-size: 1rem; }
    </style>
</head>
<body>
    <!-- Search Bar -->
    <div class="search-bar-container" id="searchBar">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索产品、新闻、技术文章..." autocomplete="off">
        <button class="btn-close" id="closeSearch">关闭</button>
        <div class="search-results" id="searchResults"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="{{ site.baseurl }}/index.html" class="logo">
                <img src="{{ site.baseurl }}/logo-white.png" alt="园龙科技">
            </a>
            <ul class="nav-menu" id="navMenu">
                <li><a href="{{ site.baseurl }}/" class="nav-link">首页</a></li>
                <li><a href="{{ site.baseurl }}/about/" class="nav-link">关于园龙</a></li>
                <li><a href="{{ site.baseurl }}/products/" class="nav-link">产品中心</a></li>
                <li><a href="{{ site.baseurl }}/news/" class="nav-link">新闻动态</a></li>
                <li><a href="{{ site.baseurl }}/technology/" class="nav-link">技术展望</a></li>
                <li><a href="{{ site.baseurl }}/contact/" class="nav-link">联系方式</a></li>
            </ul>
            <div class="nav-actions">
                <button class="search-btn" aria-label="搜索">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                </button>
                <a href="{{ site.baseurl }}/contact/" class="btn btn-accent">联系我们</a>
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    {{ content }}

    <!-- Footer -->
    {% include footer.html %}

    <script src="{{ site.baseurl }}/script.js"></script>
    <script>
    // ===== 搜索数据（由 Jekyll 编译注入） =====
    window.__SEARCH_DATA__ = {
        products: [
            {% for p in site.data.search.products %}
            {
                name: {{ p.name_zh | default: p.name | jsonify }},
                model: {{ p.model | jsonify }},
                category: {{ p.category_zh | default: p.category | jsonify }},
                slug: {{ p.slug | jsonify }},
                type: 'product'
            },
            {% endfor %}
        ],
        news: [
            {% for a in site.articles %}
            {% if a.placement == 'news' or a.placement == nil %}
            {
                title: {{ a.title | jsonify }},
                slug: {{ a.slug | jsonify }},
                category: {{ a.category | default: 'news' | jsonify }},
                date: {{ a.publishedAt | jsonify }},
                type: 'news'
            },
            {% endif %}
            {% endfor %}
        ],
        technology: [
            {% for a in site.articles %}
            {% if a.placement == 'technology' %}
            {
                title: {{ a.title | jsonify }},
                slug: {{ a.slug | jsonify }},
                category: {{ a.category | default: 'technology' | jsonify }},
                date: {{ a.publishedAt | jsonify }},
                type: 'technology'
            },
            {% endif %}
            {% endfor %}
        ]
    };
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
